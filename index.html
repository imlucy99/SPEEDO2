<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IC-7 Racing Dash</title>
  <meta name="description" content="Dashboard digital balap bergaya ECU display dengan animasi boot siluet mobil." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="stage">
    <div class="device" id="device">
      <div class="screen" id="screen">

        <!-- ================= DASH ================= -->
        <div class="dash" id="dash">
          <div class="arrow arrow-left" id="arrowLeft">
            <svg viewBox="0 0 40 30"><path d="M2 15 L18 2 V10 H38 V20 H18 V28 Z" /></svg>
          </div>
          <div class="arrow arrow-right" id="arrowRight">
            <svg viewBox="0 0 40 30"><path d="M38 15 L22 2 V10 H2 V20 H22 V28 Z" /></svg>
          </div>

          <div class="tiles tiles-left" id="tilesLeft"></div>

          <div class="gauges">
            <div class="gauge" id="gaugeRpm">
              <div class="readout">
                <div class="row big"><span class="val" id="rpmVal">0</span><span class="lbl">RPM<small>RPM</small></span></div>
                <div class="row"><span class="val" id="fuelVal">56.9</span><span class="lbl">FUEL<small>%</small></span></div>
              </div>
            </div>
            <div class="gauge" id="gaugeSpeed">
              <div class="readout">
                <div class="row big"><span class="val" id="speedVal">0</span><span class="lbl">SPEED<small>km/h</small></span></div>
                <div class="row"><span class="val gear" id="gearVal">N</span><span class="lbl">GEAR</span></div>
              </div>
            </div>

            <div class="center-icons top">
              <svg class="ico" id="icoEngine" viewBox="0 0 32 24"><path d="M6 6h6V3h8v3h3l3 3h3v8h-3l-3 3H10l-4-4H3v-4H1v-3h2V8h3z" /></svg>
            </div>
            <div class="center-icons bottom">
              <svg class="ico" id="icoOil" viewBox="0 0 36 20"><path d="M2 8l5-2 3 3h8l4-4 12 4-10 9H10L7 11H2z" /><circle cx="33" cy="15" r="2" /></svg>
            </div>
            <div class="shift" id="shift">SHIFT</div>
          </div>

          <div class="tiles tiles-right" id="tilesRight"></div>
        </div>

        <!-- ================= BOOT ================= -->
        <div class="boot" id="boot" aria-label="Animasi pembuka">
          <svg class="car" viewBox="0 0 600 170" aria-hidden="true">
            <defs>
              <clipPath id="bodyClip">
                <path id="bodyShape" d="M30 112 C28 104 32 98 48 95 L110 88 C150 82 185 78 215 76 L230 74 C255 60 275 52 300 49 C340 45 380 46 405 50 C440 56 470 64 500 68 L545 70 L552 64 L566 63 L562 72 C566 82 568 96 564 108 L556 116 L492 118 A37 37 0 0 0 418 118 L162 118 A37 37 0 0 0 88 118 L44 117 C34 116 30 114 30 112 Z" />
              </clipPath>
              <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity="0" />
                <stop offset=".5" stop-color="#ffd23a" stop-opacity=".95" />
                <stop offset="1" stop-color="#fff" stop-opacity="0" />
              </linearGradient>
              <radialGradient id="flare">
                <stop offset="0" stop-color="#fff" />
                <stop offset=".25" stop-color="#fff6c8" stop-opacity=".8" />
                <stop offset="1" stop-color="#fff" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="tail">
                <stop offset="0" stop-color="#ff3b30" />
                <stop offset="1" stop-color="#ff0000" stop-opacity="0" />
              </radialGradient>
            </defs>

            <!-- outline draw -->
            <g class="outline">
              <path pathLength="1" d="M30 112 C28 104 32 98 48 95 L110 88 C150 82 185 78 215 76 L230 74 C255 60 275 52 300 49 C340 45 380 46 405 50 C440 56 470 64 500 68 L545 70 L552 64 L566 63 L562 72 C566 82 568 96 564 108 L556 116 L492 118 A37 37 0 0 0 418 118 L162 118 A37 37 0 0 0 88 118 L44 117 C34 116 30 114 30 112 Z" />
              <circle pathLength="1" cx="125" cy="120" r="30" />
              <circle pathLength="1" cx="455" cy="120" r="30" />
            </g>

            <!-- solid silhouette -->
            <g class="solid">
              <use href="#bodyShape" fill="#fff" />
              <rect class="sweep" x="-200" y="0" width="160" height="170" fill="url(#sweep)" clip-path="url(#bodyClip)" />
              <path d="M244 76 C266 62 284 56 304 54 C340 51 375 51 398 55 C425 60 445 65 468 70 L420 72 L244 77 Z" fill="#000" />
              <path d="M380 51 L373 75" stroke="#fff" stroke-width="7" />
              <path d="M60 99 C200 92 400 88 550 86" stroke="#000" stroke-width="1.4" fill="none" opacity=".55" />
              <circle cx="125" cy="120" r="30" fill="#fff" />
              <circle cx="455" cy="120" r="30" fill="#fff" />
            </g>

            <ellipse class="ground" cx="295" cy="152" rx="270" ry="4" />
            <circle class="headlight" cx="40" cy="101" r="60" fill="url(#flare)" />
            <circle class="taillight" cx="562" cy="82" r="22" fill="url(#tail)" />
          </svg>
          <div class="boot-brand"><span class="script">Hyperdash</span><span class="model">IC-7</span></div>
          <div class="boot-bar"><i></i></div>
        </div>
      </div>

      <div class="device-logo">Hyperdash</div>
      <span class="led"></span>
    </div>

    <div class="controls">
      <button class="pedal gas" id="gasBtn" type="button">GAS<small>tahan / Space / ↑</small></button>
      <button class="pedal brake" id="brakeBtn" type="button">REM<small>↓ / S</small></button>
      <button class="ctl" id="leftBtn" type="button">◀ Sein<small>←</small></button>
      <button class="ctl" id="hazardBtn" type="button">⚠ Hazard<small>H</small></button>
      <button class="ctl" id="rightBtn" type="button">Sein ▶<small>→</small></button>
      <button class="ctl" id="replayBtn" type="button">↻ Intro<small>R</small></button>
    </div>
    <p class="rotate-hint">Putar ponsel ke posisi landscape untuk tampilan terbaik.</p>
  </main>
  <script src="/app.js"></script>
<script async src="/.netlify/scripts/ar" data-netlify-deploy-id="6ac7f4ccef42cac6109626da" data-netlify-site-id="30294c71-6c23-43df-b912-027ce75a966d" data-agent-runner-id="6ac7f3a47d0ffd30e5a02f5c"></script>
</body>
</html>
